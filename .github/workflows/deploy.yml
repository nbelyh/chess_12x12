# Тесты и деплой веб-версии в Azure App Service (chess12x12-96b6).
# Вход в Azure — по федеративному удостоверению (OIDC), без секретов.
# Деплой — через Kudu zipdeploy с токеном Entra: basic auth на сайте выключен.

name: Test and deploy

on:
  push:
    branches: [web-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBAPP_NAME: chess12x12-96b6
  AZURE_CLIENT_ID: 60306916-db20-42c6-a0b1-cda1a32732bb
  AZURE_TENANT_ID: af560c63-363a-40cb-aae8-35622f64364d
  AZURE_SUBSCRIPTION_ID: 82a39a59-71d1-4e06-9226-6e96a5402e51

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Package app
        run: zip -qr app.zip requirements.txt src -x '*__pycache__*'

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/web-app' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.WEBAPP_NAME }}.azurewebsites.net
    permissions:
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          set -euo pipefail
          scm="https://$WEBAPP_NAME.scm.azurewebsites.net"
          token=$(az account get-access-token --query accessToken -o tsv)

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/zip' \
            --data-binary @app.zip "$scm/api/zipdeploy?isAsync=true")
          echo "zipdeploy: HTTP $code"
          [ "$code" = 202 ] || exit 1

          # Ждём окончания сборки Oryx (status 4 = успех, 3 = ошибка).
          for i in $(seq 1 60); do
            sleep 10
            status=$(curl -s -H "Authorization: Bearer $token" "$scm/api/deployments/latest" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'], d['complete'])")
            echo "deployment status: $status"
            case "$status" in
              "4 True") exit 0 ;;
              *" True") echo "::error::Deployment failed"; exit 1 ;;
            esac
          done
          echo "::error::Deployment timed out"
          exit 1

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf -m 30 "https://$WEBAPP_NAME.azurewebsites.net/health"; then echo; exit 0; fi
            echo "waiting for the site to start..."
            sleep 10
          done
          exit 1
